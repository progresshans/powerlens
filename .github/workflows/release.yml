name: Publish Release

on:
  push:
    branches:
      - develop
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v, for example 0.9.1 or 0.9.2-alpha.1"
        required: true
        type: string
      channel:
        description: "Sparkle update channel to publish"
        required: true
        default: stable
        type: choice
        options:
          - stable
          - alpha

permissions:
  contents: read

# Keep a running automatic alpha, but coalesce multiple pending develop pushes
# into the newest commit. Explicit tag and dispatch runs get unique groups.
concurrency:
  group: release-request-${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' && 'develop' || github.run_id }}
  cancel-in-progress: false

jobs:
  release_approval:
    name: Approve Explicit Release
    if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    environment: release-approval

    steps:
      - name: Record approved release request
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          printf \
            'Approved %s release request for %s at %s\n' \
            "$RELEASE_EVENT" \
            "$RELEASE_REF" \
            "$RELEASE_SHA"

  build:
    name: Build and Notarize Release
    needs: release_approval
    if: ${{ always() && !cancelled() && (needs.release_approval.result == 'success' || needs.release_approval.result == 'skipped') }}
    runs-on: macos-26
    environment: release
    permissions:
      contents: write

    env:
      POWERLENS_BUILD_SYSTEM: native
      POWERLENS_SIGN_IDENTITY: ${{ secrets.POWERLENS_SIGN_IDENTITY }}
      POWERLENS_SPARKLE_PUBLIC_ED_KEY: ${{ secrets.POWERLENS_SPARKLE_PUBLIC_ED_KEY }}
      POWERLENS_SPARKLE_PRIVATE_ED_KEY: ${{ secrets.POWERLENS_SPARKLE_PRIVATE_ED_KEY }}
      POWERLENS_SPARKLE_FEED_URL: https://progresshans.github.io/powerlens/appcast.xml
      POWERLENS_SPARKLE_ALPHA_FEED_URL: https://progresshans.github.io/powerlens/appcast-alpha.xml

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate Apple silicon runner
        run: |
          test "$(uname -m)" = "arm64"
          uname -m

      - name: Validate manually dispatched release notes
        id: manual_notes
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          ./script/generate_release_notes.sh \
            "$VERSION" \
            "$RUNNER_TEMP/powerlens-release-notes.md" \
            "$GITHUB_WORKSPACE/CHANGELOG.md" \
            require-notes
          echo "validated=true" >> "$GITHUB_OUTPUT"

      - name: Resolve release metadata
        id: meta
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
          DISPATCH_CHANNEL: ${{ inputs.channel }}
          ALPHA_BASE_VERSION: ${{ vars.POWERLENS_ALPHA_BASE_VERSION }}
          MANUAL_NOTES_VALIDATED: ${{ steps.manual_notes.outputs.validated }}
        run: ./script/resolve_release_metadata.sh

      - name: Create release notes
        if: github.event_name != 'workflow_dispatch'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          RELEASE_NOTES_MODE: ${{ steps.meta.outputs.release_notes_mode }}
        run: |
          ./script/generate_release_notes.sh \
            "$VERSION" \
            "$RUNNER_TEMP/powerlens-release-notes.md" \
            "$GITHUB_WORKSPACE/CHANGELOG.md" \
            "$RELEASE_NOTES_MODE"

      - name: Record release provenance
        env:
          RELEASE_RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
        run: |
          printf \
            '\n<!-- powerlens-release-run-id: %s -->\n<!-- powerlens-release-sha: %s -->\n' \
            "$RELEASE_RUN_ID" \
            "$SOURCE_SHA" \
            >> "$RUNNER_TEMP/powerlens-release-notes.md"

      - name: Validate release secrets
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.POWERLENS_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.POWERLENS_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.POWERLENS_KEYCHAIN_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.POWERLENS_NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.POWERLENS_NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.POWERLENS_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          required=(
            CERTIFICATE_P12_BASE64
            CERTIFICATE_PASSWORD
            KEYCHAIN_PASSWORD
            NOTARY_APPLE_ID
            NOTARY_TEAM_ID
            NOTARY_PASSWORD
            POWERLENS_SIGN_IDENTITY
            POWERLENS_SPARKLE_PUBLIC_ED_KEY
            POWERLENS_SPARKLE_PRIVATE_ED_KEY
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "missing required GitHub secret: $name" >&2
              exit 2
            fi
          done

          validate_base64_secret() {
            local name="$1"
            local expected_byte_lengths="$2"

            POWERLENS_SECRET_NAME="$name" \
              POWERLENS_SECRET_VALUE="${!name}" \
              POWERLENS_EXPECTED_BYTE_LENGTHS="$expected_byte_lengths" \
              python3 - <<'PY'
          import base64
          import os

          name = os.environ["POWERLENS_SECRET_NAME"]
          value = os.environ["POWERLENS_SECRET_VALUE"].strip()
          expected_byte_lengths = {
              int(length)
              for length in os.environ["POWERLENS_EXPECTED_BYTE_LENGTHS"].replace(",", " ").split()
          }

          try:
              decoded = base64.b64decode(value, validate=True)
          except Exception as error:
              raise SystemExit(f"invalid {name}: {error}")

          if len(decoded) not in expected_byte_lengths:
              expected = " or ".join(str(length) for length in sorted(expected_byte_lengths))
              raise SystemExit(f"{name} must decode to {expected} bytes, got {len(decoded)} bytes")
          PY
          }

          validate_base64_secret POWERLENS_SPARKLE_PUBLIC_ED_KEY 32
          validate_base64_secret POWERLENS_SPARKLE_PRIVATE_ED_KEY "32 96"

      - name: Import Developer ID certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.POWERLENS_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.POWERLENS_DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.POWERLENS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          keychain_path="$RUNNER_TEMP/powerlens-signing.keychain-db"
          certificate_path="$RUNNER_TEMP/powerlens-developer-id.p12"

          echo "$CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" \
            -k "$keychain_path" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productsign
          security list-keychains -d user -s "$keychain_path" login.keychain-db
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain_path"
          echo "POWERLENS_NOTARY_KEYCHAIN=$keychain_path" >> "$GITHUB_ENV"

      - name: Store notarization credentials
        env:
          NOTARY_APPLE_ID: ${{ secrets.POWERLENS_NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.POWERLENS_NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.POWERLENS_NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          xcrun notarytool store-credentials powerlens-notary \
            --keychain "$POWERLENS_NOTARY_KEYCHAIN" \
            --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$NOTARY_TEAM_ID" \
            --password "$NOTARY_PASSWORD"

      - name: Build signed notarized release
        env:
          POWERLENS_VERSION: ${{ steps.meta.outputs.version }}
          POWERLENS_BUILD: ${{ github.run_number }}
          POWERLENS_NOTARY_PROFILE: powerlens-notary
          POWERLENS_SPARKLE_GENERATE_APPCAST: "1"
          POWERLENS_SPARKLE_APPCAST_DIR: ${{ github.workspace }}/release/appcast-work
          POWERLENS_SPARKLE_APPCAST_OUTPUT_PATH: ${{ github.workspace }}/${{ steps.meta.outputs.appcast_path }}
          POWERLENS_SPARKLE_DOWNLOAD_URL_PREFIX: ${{ steps.meta.outputs.download_url_prefix }}
          POWERLENS_SPARKLE_RELEASE_NOTES_URL_PREFIX: ${{ steps.meta.outputs.download_url_prefix }}
        run: ./script/package_release.sh

      - name: Verify arm64 distribution bundle
        env:
          STRICT: "1"
        run: ./script/verify_distribution.sh release/stage/PowerLens.app

      - name: Verify reserved release tag
        if: steps.meta.outputs.tag_origin != 'pending'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
          TAG_ORIGIN: ${{ steps.meta.outputs.tag_origin }}
          RELEASE_RUN_ID: ${{ github.run_id }}
        run: |
          ./script/verify_release_tag.sh \
            "$TAG" \
            "$SOURCE_SHA" \
            "$TAG_ORIGIN" \
            "$RELEASE_RUN_ID"

      - name: Stage publication artifact
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
          APPCAST_PATH: ${{ steps.meta.outputs.appcast_path }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          LATEST: ${{ steps.meta.outputs.latest }}
          RELEASE_KIND: ${{ steps.meta.outputs.release_kind }}
          TAG_ORIGIN: ${{ steps.meta.outputs.tag_origin }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
          RELEASE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          publish_dir="$RUNNER_TEMP/powerlens-publish"
          rm -rf "$publish_dir"
          mkdir -p "$publish_dir"

          cp "release/PowerLens-$VERSION.dmg" "$publish_dir/"
          cp "release/PowerLens-$VERSION.app.zip" "$publish_dir/"
          cp "release/PowerLens-$VERSION-checksums.txt" "$publish_dir/"
          cp "$APPCAST_PATH" "$publish_dir/appcast.xml"
          cp "$RUNNER_TEMP/powerlens-release-notes.md" "$publish_dir/release-notes.md"

          {
            printf 'VERSION=%s\n' "$VERSION"
            printf 'TAG=%s\n' "$TAG"
            printf 'CHANNEL=%s\n' "$CHANNEL"
            printf 'APPCAST_PATH=%s\n' "$APPCAST_PATH"
            printf 'PRERELEASE=%s\n' "$PRERELEASE"
            printf 'LATEST=%s\n' "$LATEST"
            printf 'RELEASE_KIND=%s\n' "$RELEASE_KIND"
            printf 'TAG_ORIGIN=%s\n' "$TAG_ORIGIN"
            printf 'SOURCE_SHA=%s\n' "$SOURCE_SHA"
            printf 'RELEASE_RUN_ID=%s\n' "$RELEASE_RUN_ID"
          } > "$publish_dir/metadata.env"

      - name: Upload publication artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: powerlens-release-${{ github.run_id }}
          path: ${{ runner.temp }}/powerlens-publish
          if-no-files-found: error
          overwrite: true
          retention-days: 14
          compression-level: 0

  publish:
    name: Publish Release and Sparkle Appcast
    needs: build
    # Automatic develop alphas skip release_approval. Evaluate this job
    # explicitly so that ancestor skip does not propagate past a successful build.
    if: ${{ always() && !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pages: write
      id-token: write
    concurrency:
      group: publish-release
      cancel-in-progress: false
      queue: max
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    env:
      POWERLENS_SPARKLE_FEED_URL: https://progresshans.github.io/powerlens/appcast.xml
      POWERLENS_SPARKLE_ALPHA_FEED_URL: https://progresshans.github.io/powerlens/appcast-alpha.xml

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download publication artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: powerlens-release-${{ github.run_id }}
          path: ${{ runner.temp }}/powerlens-publish

      - name: Validate publication metadata
        id: meta
        env:
          METADATA_PATH: ${{ runner.temp }}/powerlens-publish/metadata.env
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          VERSION=""
          TAG=""
          CHANNEL=""
          APPCAST_PATH=""
          PRERELEASE=""
          LATEST=""
          RELEASE_KIND=""
          TAG_ORIGIN=""
          SOURCE_SHA=""
          RELEASE_RUN_ID=""

          while IFS='=' read -r key value; do
            case "$key" in
              VERSION | TAG | CHANNEL | APPCAST_PATH | PRERELEASE | LATEST | RELEASE_KIND | TAG_ORIGIN | SOURCE_SHA | RELEASE_RUN_ID)
                printf -v "$key" '%s' "$value"
                ;;
              *)
                echo "unsupported publication metadata key: $key" >&2
                exit 2
                ;;
            esac
          done < "$METADATA_PATH"

          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-alpha\.[0-9]+)?$ ]]
          [[ "$TAG" == "v$VERSION" ]]
          [[ "$CHANNEL" == "stable" || "$CHANNEL" == "alpha" ]]
          [[ "$APPCAST_PATH" == "docs/appcast.xml" || "$APPCAST_PATH" == "docs/appcast-alpha.xml" ]]
          [[ "$PRERELEASE" == "true" || "$PRERELEASE" == "false" ]]
          [[ "$LATEST" == "true" || "$LATEST" == "false" ]]
          [[ "$RELEASE_KIND" == "automatic" || "$RELEASE_KIND" == "tag" || "$RELEASE_KIND" == "manual" ]]
          [[ "$TAG_ORIGIN" == "event" || "$TAG_ORIGIN" == "reserved" || "$TAG_ORIGIN" == "pending" ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_SHA" == "$(git rev-parse "${EXPECTED_SHA}^{commit}")" ]]
          [[ "$RELEASE_RUN_ID" == "$EXPECTED_RUN_ID" ]]

          case "$RELEASE_KIND:$TAG_ORIGIN" in
            automatic:reserved | tag:event | manual:pending)
              ;;
            *)
              echo "invalid release kind and tag origin: $RELEASE_KIND / $TAG_ORIGIN" >&2
              exit 2
              ;;
          esac

          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "channel=$CHANNEL"
            echo "appcast_path=$APPCAST_PATH"
            echo "prerelease=$PRERELEASE"
            echo "latest=$LATEST"
            echo "release_kind=$RELEASE_KIND"
            echo "tag_origin=$TAG_ORIGIN"
            echo "source_sha=$SOURCE_SHA"
            echo "release_run_id=$RELEASE_RUN_ID"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare GitHub Pages artifact
        env:
          APPCAST_PATH: ${{ steps.meta.outputs.appcast_path }}
          VERSION: ${{ steps.meta.outputs.version }}
          CHANNEL: ${{ steps.meta.outputs.channel }}
          GENERATED_APPCAST: ${{ runner.temp }}/powerlens-publish/appcast.xml
          STABLE_FEED_URL: ${{ env.POWERLENS_SPARKLE_FEED_URL }}
          ALPHA_FEED_URL: ${{ env.POWERLENS_SPARKLE_ALPHA_FEED_URL }}
          CACHE_BUSTER: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail

          pages_dir="$RUNNER_TEMP/powerlens-pages"
          rm -rf "$pages_dir"
          mkdir -p "$pages_dir"
          cp -R docs/. "$pages_dir/"

          fetch_existing_feed() {
            local url="$1"
            local destination="$2"
            local tmp="$destination.tmp"
            local status
            local request_url

            request_url="${url}?powerlens-release=$CACHE_BUSTER"

            status="$(
              curl \
                --silent \
                --show-error \
                --location \
                --retry 3 \
                --retry-all-errors \
                --connect-timeout 15 \
                --max-time 60 \
                --header 'Cache-Control: no-cache' \
                --output "$tmp" \
                --write-out '%{http_code}' \
                "$request_url"
            )" || {
              rm -f "$tmp"
              echo "failed to preserve existing feed from $url" >&2
              return 1
            }

            case "$status" in
              200)
                python3 - "$tmp" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          ET.parse(sys.argv[1])
          PY
                mv "$tmp" "$destination"
                echo "preserved existing feed from $url"
                ;;
              404)
                rm -f "$tmp"
                echo "no existing feed at $url; using repository placeholder"
                ;;
              *)
                rm -f "$tmp"
                echo "unexpected HTTP $status while preserving $url" >&2
                return 1
                ;;
            esac
          }

          fetch_existing_feed "$STABLE_FEED_URL" "$pages_dir/appcast.xml"
          fetch_existing_feed "$ALPHA_FEED_URL" "$pages_dir/appcast-alpha.xml"

          relative_appcast="${APPCAST_PATH#docs/}"
          mkdir -p "$pages_dir/$(dirname "$relative_appcast")"
          ./script/validate_appcast_progression.sh \
            "$pages_dir/appcast.xml" \
            "$pages_dir/appcast-alpha.xml" \
            "$GENERATED_APPCAST" \
            "$VERSION" \
            "$CHANNEL"
          cp "$GENERATED_APPCAST" "$pages_dir/$relative_appcast"
          python3 - "$pages_dir/$relative_appcast" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          ET.parse(sys.argv[1])
          PY

      - name: Reserve manually dispatched release tag
        id: manual_tag
        if: steps.meta.outputs.release_kind == 'manual'
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
          RELEASE_RUN_ID: ${{ steps.meta.outputs.release_run_id }}
        run: |
          ./script/reserve_release_tag.sh \
            "$TAG" \
            "$SOURCE_SHA" \
            "$RELEASE_RUN_ID"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          LATEST: ${{ steps.meta.outputs.latest }}
          SOURCE_SHA: ${{ steps.meta.outputs.source_sha }}
          TAG_ORIGIN: ${{ steps.manual_tag.outputs.tag_origin || steps.meta.outputs.tag_origin }}
          RELEASE_RUN_ID: ${{ steps.meta.outputs.release_run_id }}
          RELEASE_NOTES_PATH: ${{ runner.temp }}/powerlens-publish/release-notes.md
          RELEASE_ASSET_DIR: ${{ runner.temp }}/powerlens-publish
        run: ./script/publish_github_release.sh

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/powerlens-pages

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
