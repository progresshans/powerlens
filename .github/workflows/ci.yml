name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.check_name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            check_name: Build, Test, and Package Smoke Check
          - runner: xcode-27
            check_name: Xcode 27 Compatibility Check

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show toolchain
        run: |
          test "$(uname -m)" = "arm64"
          uname -m
          sw_vers
          swift --version
          xcodebuild -version

      - name: Run unit tests
        run: swift test --arch arm64

      - name: Test system API contract verifier
        run: python3 -m unittest discover -s script/tests -p 'test_*.py' -v

      - name: Validate scripts
        run: |
          bash -n \
            script/lib/powerlens_packaging.sh \
            script/build_and_run.sh \
            script/generate_release_notes.sh \
            script/package_release.sh \
            script/publish_github_release.sh \
            script/reserve_release_tag.sh \
            script/resolve_release_metadata.sh \
            script/smoke_launch_app.sh \
            script/test_generate_release_notes.sh \
            script/test_release_workflow.sh \
            script/test_sparkle_update.sh \
            script/validate_appcast_progression.sh \
            script/verify_distribution.sh \
            script/verify_release_tag.sh

      - name: Validate release-note generation
        run: bash script/test_generate_release_notes.sh

      - name: Validate release workflow
        run: bash script/test_release_workflow.sh

      - name: Validate metadata
        run: |
          plutil -lint \
            Packaging/Info.plist \
            Sources/PowerLens/Resources/en.lproj/Localizable.strings \
            Sources/PowerLens/Resources/ko.lproj/Localizable.strings
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          for path in ("docs/appcast.xml", "docs/appcast-alpha.xml"):
              ET.parse(path)
              print(f"{path}: OK")
          PY

      - name: Package ad-hoc release smoke build
        env:
          POWERLENS_VERSION: 0.0.0-ci
          POWERLENS_BUILD: ${{ github.run_number }}
          POWERLENS_SKIP_NOTARIZATION: "1"
          POWERLENS_CLEAN_BUILD: "0"
          # Valid 32-byte base64 placeholder: exercises the public-key-only
          # package path without exposing or using a release private key.
          POWERLENS_SPARKLE_PUBLIC_ED_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: ./script/package_release.sh

      - name: Verify packaged arm64 bundle
        run: |
          ./script/verify_distribution.sh release/stage/PowerLens.app
          test -f release/PowerLens-0.0.0-ci.app.zip
          test -f release/PowerLens-0.0.0-ci.dmg
          test -f release/PowerLens-0.0.0-ci-checksums.txt
          test "$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' release/stage/PowerLens.app/Contents/Info.plist)" \
            = "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' release/stage/PowerLens.app/Contents/Info.plist)" \
            = "26.0"

      - name: Probe macOS system API contracts
        run: |
          mkdir -p release/system-api-probe
          release/stage/PowerLens.app/Contents/MacOS/PowerLens \
            --system-api-probe \
            --format json \
            > "release/system-api-probe/${{ matrix.runner }}.json"
          python3 script/verify_system_api_probe.py \
            --profile script/system-api-contracts/macos-26.json \
            "release/system-api-probe/${{ matrix.runner }}.json"

      - name: Upload system API probe report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: system-api-probe-${{ matrix.runner }}
          path: release/system-api-probe/${{ matrix.runner }}.json
          if-no-files-found: error
          retention-days: 14

      - name: Launch packaged app
        run: ./script/smoke_launch_app.sh release/stage/PowerLens.app
